    }).join('') + '</div>';

// --- вкладка «Счета» ---
function viewAcc() {
  var b = balances();

  ACC_GROUPS.forEach(function (g) {
    var list = accList(true).filter(function (a) { return g.types.indexOf(a.type) >= 0; });
    if (!list.length) return;
    html += '<div class="section"><h3>' + g.title + '</h3>' + list.map(function (a) {
      var sub = [a.bank, a.card ? 'карта •' + a.card : '', a.acct ? 'счёт •' + a.acct : ''].filter(String).join(' · ');
      if (a.archived) sub = 'в архиве';
      else if (b[a.id].bank) sub += (sub ? ' · ' : '') + 'баланс из SMS ' + fmtAt(a.bankBalanceAt);
      return '<button class="item' + (a.archived ? ' off' : '') + '" data-act="acc-open" data-id="' + a.id + '"><div class="ico" style="--c:' + a.color + '">' + esc(a.icon) + '</div>' +
        '<div class="mid"><div class="t1">' + esc(a.name) + (a.main ? ' <small class="muted">· основной</small>' : '') + '</div><div class="t2">' + esc(sub || ACC_TYPES[a.type]) + '</div></div>' +
        '<div class="amt' + (b[a.id].shown < 0 ? ' neg' : '') + '">' + money(b[a.id].shown) + '</div></button>';
    }).join('') + '</div>';
  });
  return html;
}
function fmtAt(s) { if (!s) return ''; var d = s.slice(0, 10), t = s.slice(11, 16); return dayShort(d) + (t ? ' ' + t : ''); }
function opAccEffect(o, id) {
  var acc = accOf(o);
  if (o.type === 'expense') return acc === id ? -o.amount : 0;
  if (o.type === 'income' || o.type === 'adjust') return acc === id ? o.amount : 0;
  return (acc === id ? -o.amount : 0) + (o.toAccount === id ? o.amount : 0);
}
function openAccount(id) {
  var a = accById(id), b = balances()[id];
  if (!a) return;
  var ops = S.data.ops.filter(function (o) { return opAccEffect(o, id) !== 0; }).sort(function (x, y) { return y.date.localeCompare(x.date); }).slice(0, 25);
  F = { kind: 'accv', id: id };
  openSheet(sheetHead(esc(a.icon + ' ' + a.name)) +
    '<div class="rcsum"><div><b class="' + (b.shown < 0 ? 'neg' : '') + '" style="font-size:22px">' + money(b.shown) + '</b><div class="muted small">' +
    (b.bank ? 'баланс из SMS банка, ' + fmtAt(a.bankBalanceAt) : 'по операциям в приложении') + '</div></div>' +
    '<div class="muted small" style="text-align:right">' + ACC_TYPES[a.type] + (a.bank ? '<br>' + esc(a.bank) : '') + '</div></div>' +
    '<div class="actions" style="margin-bottom:12px">' + (b.bank ? '' : '<button class="btn primary" data-act="acc-fix">Сверить баланс</button>') +
    '<button class="btn ghost" data-act="acc-edit">Настройки счёта</button></div>' +
    '<h4 class="rch">Последние операции</h4><div class="section" style="padding:6px">' + (ops.length ? ops.map(function (o) {
      var v = opAccEffect(o, id);
      return '<div class="rctot" style="padding:6px 4px"><span>' + dayShort(o.date) + ' · ' + esc(opTitle(o)) + '</span><b class="' + (v < 0 ? 'neg' : 'pos') + '">' + (v > 0 ? '+' : '−') + money(Math.abs(v)) + '</b></div>';
    }).join('') : '<div class="empty">Операций пока нет</div>') + '</div>');
}
function opTitle(o) {
  if (o.type === 'transfer') return 'Перевод ' + accName(accOf(o)) + ' → ' + accName(o.toAccount);
  if (o.type === 'adjust') return 'Корректировка баланса' + (o.comment ? ' (' + o.comment + ')' : '');
  return o.category + (o.comment ? ' · ' + o.comment : '');
}
function openReconcile() {

  F = { kind: 'accfix', id: a.id };
  openSheet(sheetHead('Сверить баланс') +
    '<p class="muted small" style="margin-bottom:10px">Сейчас в приложении: <b>' + money(b.calc) + '</b>. Введите, сколько на самом деле на «' + esc(a.name) + '» — разница запишется корректировкой и не попадёт в доходы и расходы.</p>' +
    '<input id="fx-amount" class="amount" inputmode="decimal" placeholder="0 ₽" autocomplete="off">' +
    '<div class="actions" style="margin-top:12px"><button class="btn ghost" data-act="close">Отмена</button><button class="btn primary" data-act="acc-fix-save">Сохранить</button></div>');
  setTimeout(function () { var x = $('#fx-amount'); if (x) x.focus(); }, 60);
}
function saveReconcile() {
  var raw = val('fx-amount').trim();
  var actual = raw.charAt(0) === '-' ? -parseAmount(raw.slice(1)) : parseAmount(raw);
  if (raw === '' || isNaN(actual)) return toast('Введите сумму', true);
  var diff = Math.round((actual - balances()[F.id].calc) * 100) / 100;
  if (!diff) { closeSheet(); return toast('Баланс уже совпадает'); }
  busy(true);
  call('saveOperation', { type: 'adjust', date: todayIso(), amount: diff, account: F.id, comment: 'Сверка' })
    .then(function (saved) { S.data.ops.push(saved); closeSheet(); render(); toast('Баланс сверен: ' + (diff > 0 ? '+' : '−') + money(Math.abs(diff))); })
    .catch(function (e) { busy(false); toast(e, true); });
}
function openAccForm(a) {
  F = Object.assign({ kind: 'acc', id: '', name: '', type: 'card', bank: '', card: '', acct: '', icon: '💳', color: PALETTE[1], sync: false, main: false, archived: false }, a || {});
  renderAccForm();
}
function syncAccForm() {
  if (!F || F.kind !== 'acc' || !$('#a-name')) return;
  F.name = val('a-name'); F.type = val('a-type'); F.bank = val('a-bank'); F.icon = val('a-icon');
  F.card = val('a-card'); F.acct = val('a-acct');
  F.sync = $('#a-sync').checked; F.main = $('#a-main').checked; var ar = $('#a-arch'); if (ar) F.archived = ar.checked;
}
function renderAccForm() {
  openSheet(sheetHead(F.id ? 'Настройки счёта' : 'Новый счёт') +
    '<div class="row2" style="grid-template-columns:80px 1fr"><label>Иконка<input id="a-icon" maxlength="4" style="text-align:center;font-size:20px" value="' + esc(F.icon) + '"></label>' +
    '<label>Название<input id="a-name" maxlength="40" placeholder="Например: Сбер MIR-2902" value="' + esc(F.name) + '"></label></div>' +
    '<div class="row2"><label>Тип<select id="a-type">' + Object.keys(ACC_TYPES).map(function (k) {
      return '<option value="' + k + '"' + (F.type === k ? ' selected' : '') + '>' + ACC_TYPES[k] + '</option>';
    }).join('') + '</select></label><label>Банк<input id="a-bank" maxlength="40" placeholder="Сбербанк" value="' + esc(F.bank) + '"></label></div>' +
    '<h4 class="rch">Привязка SMS и пушей</h4>' +
    '<div class="row2"><label>Карта — последние 4 цифры<input id="a-card" inputmode="numeric" maxlength="4" placeholder="2902" value="' + esc(F.card) + '"></label>' +
    '<label>Счёт — последние 4 цифры<input id="a-acct" inputmode="numeric" maxlength="4" placeholder="9134" value="' + esc(F.acct) + '"></label></div>' +
    '<p class="muted small" style="margin:-6px 2px 12px">Где найти: в SMS «Счёт карты MIR-<b>2902</b>», «СЧЁТ<b>9134</b>», в пуше «Плат. счёт •• <b>9134</b>». Достаточно одного из двух, лучше оба.</p>' +
    '<label class="check"><input type="checkbox" id="a-sync"' + (F.sync ? ' checked' : '') + '>Брать баланс из SMS банка (точнее всего)</label>' +
    '<label class="check"><input type="checkbox" id="a-main"' + (F.main ? ' checked' : '') + '>Основной — для операций, введённых вручную</label>' +
    (F.id ? '<label class="check"><input type="checkbox" id="a-arch"' + (F.archived ? ' checked' : '') + '>В архиве (скрыть)</label>' : '') +
    '<label>Цвет</label><div class="colors">' + PALETTE.map(function (c) {
      return '<button class="' + (F.color === c ? 'on' : '') + '" style="--c:' + c + '" data-act="acc-color" data-c="' + c + '"></button>';
    }).join('') + '</div>' +
    '<div class="actions">' + (F.id ? '<button class="btn danger" data-act="acc-del">Удалить</button>' : '') + '<button class="btn primary" data-act="acc-save">Сохранить</button></div>');
}
function saveAccForm() {
  syncAccForm();
  if (!F.name.trim()) return toast('Введите название', true);
  if ((F.card && !/^\d{4}$/.test(F.card)) || (F.acct && !/^\d{4}$/.test(F.acct))) return toast('Нужны ровно 4 цифры', true);
  busy(true);
  var isNew = !F.id;
  call('saveAccount', { id: F.id, name: F.name, type: F.type, bank: F.bank, card: F.card, acct: F.acct, icon: F.icon, color: F.color, sync: F.sync, main: F.main, archived: F.archived })
    .then(function () {
      closeSheet(); toast(isNew ? 'Счёт добавлен' : 'Сохранено');
      return reload();
    }).catch(function (e) { busy(false); toast(e, true); });
}

ARGS.saveAccount = ['account']; ARGS.deleteAccount = ['id'];
NAV.splice(3, 0, { id: 'acc', ic: '💳', t: 'Счета' });

Object.assign(ACTIONS, {
  'acc-open': function (el) { openAccount(el.dataset.id); },
  'acc-new': function () { openAccForm(); },
  'acc-edit': function () { var a = accById(F.id); if (a) openAccForm(Object.assign({}, a)); },
  'acc-fix': function () { openReconcile(); },
  'acc-fix-save': function () { saveReconcile(); },
  'acc-save': function () { saveAccForm(); },
  'acc-color': function (el) {
    syncAccForm(); F.color = el.dataset.c;
    document.querySelectorAll('.colors button').forEach(function (b) { b.classList.toggle('on', b === el); });
  },
  'acc-del': function (el) {
    if (!el.dataset.sure) { el.dataset.sure = '1'; el.textContent = 'Точно удалить?'; return; }
    busy(true);
    call('deleteAccount', F.id).then(function (res) {
      closeSheet(); toast(res && res.archived ? 'По счёту есть операции — он перенесён в архив' : 'Счёт удалён');
      return reload();
    }).catch(function (e) { busy(false); toast(e, true); });
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && F && F.kind === 'accfix' && e.target.id === 'fx-amount') { e.preventDefault(); saveReconcile(); }
  if (e.key === 'Enter' && F && F.kind === 'acc' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') { e.preventDefault(); saveAccForm(); }
});
document.addEventListener('change', function (e) {
  if (F && F.kind === 'op' && (e.target.id === 'f-acc' || e.target.id === 'f-acc2')) { syncOpForm(); }
  if (F && F.kind === 'rec' && (e.target.id === 'r-acc' || e.target.id === 'r-acc2')) { syncRecForm(); }
});
</script>
</body>
</html>

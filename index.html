<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бюджет</title>
<meta name="theme-color" content="#0d1117">
<meta name="description" content="Учёт доходов, расходов и сбережений">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1f2630;--border:#30363d;--text:#e6edf3;--muted:#8b949e;
  --accent:#2f81f7;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a371f7;--radius:14px;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f4f6f9;--panel:#ffffff;--panel2:#eef1f5;--border:#d8dee4;--text:#1f2328;--muted:#656d76;}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%;outline:none;min-height:42px}
input:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
label input,label select{margin-top:5px}
a{color:var(--accent)}

.app{display:flex;min-height:100vh}
.sidebar{display:none}
.main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:14px 14px 100px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.title{font-size:21px;font-weight:700}
.month{display:flex;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:2px}
.month button{width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1}
.month button:hover{background:var(--panel2)}
.month span{min-width:120px;text-align:center;font-weight:600;font-size:14px}

.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;min-width:0}
.card .lbl{color:var(--muted);font-size:12px}
.card .val{font-size:19px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--green)}.neg{color:var(--red)}.sav{color:var(--purple)}

.section{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;min-width:0}
.section h3{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.section h3 small{font-weight:400;color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.small{font-size:12px}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:14px}
.linkbtn{color:var(--accent);font-size:13px;font-weight:600}

/* лимиты */
.lim{margin-bottom:12px}
.lim:last-child{margin-bottom:0}
.lim-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px}
.lim-top b{font-weight:600}
.bar{position:relative;height:8px;background:var(--panel2);border-radius:99px;overflow:visible}
.bar i{display:block;height:100%;border-radius:99px;background:var(--green)}
.bar.warn i{background:var(--yellow)}.bar.over i{background:var(--red)}
.bar em{position:absolute;top:-3px;width:2px;height:14px;background:var(--text);opacity:.45;border-radius:2px}
.lim-sub{font-size:12px;color:var(--muted);margin-top:4px}

/* структура расходов */
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;border-radius:50%;flex:none;position:relative;margin:0 auto}
.donut .hole{position:absolute;inset:22px;background:var(--panel);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut .hole b{font-size:15px}
.donut .hole span{font-size:11px;color:var(--muted)}
.legend{flex:1;min-width:200px}
.lg{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:8px;width:100%;text-align:left;font-size:14px}
.lg:hover{background:var(--panel2)}
.lg .dot{width:10px;height:10px;border-radius:50%;flex:none}
.lg .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .pc{color:var(--muted);font-size:12px;width:38px;text-align:right}

/* тренд */
.lchart{width:100%;height:auto;max-height:260px;display:block;overflow:visible}
.lchart .grid{stroke:var(--border);stroke-width:1}
.lchart .ylab{fill:var(--muted);font-size:10px;text-anchor:end}
.lchart .xlab{fill:var(--muted);font-size:11px;text-anchor:middle}
.lchart .xlab.cur{fill:var(--text);font-weight:700}
.fcnote{font-size:13px;margin-top:10px;line-height:1.5}
.fcwarn{font-size:13px;color:var(--yellow);margin-top:6px}
.trend{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;cursor:pointer}
.tbars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.tbars i{display:block;width:30%;max-width:14px;border-radius:4px 4px 0 0;min-height:2px}
.tcol span{font-size:11px;color:var(--muted)}
.tcol.cur span{color:var(--text);font-weight:700}
.tlegend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.tlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* списки */
.item{display:flex;align-items:center;gap:11px;padding:9px 6px;border-radius:10px;width:100%;text-align:left}
.item:hover{background:var(--panel2)}
.ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;background:color-mix(in srgb,var(--c) 22%,transparent)}
.item .mid{flex:1;min-width:0}
.item .t1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:600;white-space:nowrap;text-align:right}
.item.off{opacity:.5}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:12px 6px 4px;border-bottom:1px solid var(--border);margin-bottom:4px}
.dayhead:first-child{padding-top:0}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--panel2);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.tag.late{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.paybtn{font-size:13px;font-weight:600;color:#fff;background:var(--accent);padding:7px 12px;border-radius:9px;white-space:nowrap}

/* фильтры */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:99px;background:var(--panel);border:1px solid var(--border);font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.summary{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-bottom:10px;color:var(--muted)}
.summary b{color:var(--text)}

/* навигация */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted);padding:3px 4px;min-width:62px}
.navbtn .ic{font-size:21px;line-height:1.1}
.navbtn.on{color:var(--accent)}
.fab{width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;font-size:32px;line-height:1;margin-top:-28px;box-shadow:0 6px 18px rgba(47,129,247,.45);flex:none}
.sidebtn{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;color:var(--muted);font-weight:500;width:100%;text-align:left}
.sidebtn:hover{background:var(--panel2);color:var(--text)}
.sidebtn.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--text)}
.brand{font-size:19px;font-weight:700;padding:4px 14px 18px}

/* кнопки */
.btn{padding:12px 16px;border-radius:11px;font-weight:600;font-size:15px;flex:1;min-height:46px}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--panel2);border:1px solid var(--border)}
.btn.danger{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.btn.small{flex:none;padding:8px 13px;min-height:0;font-size:13px}
.actions{display:flex;gap:8px;margin-top:6px}

/* модальное окно */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(1,4,9,.6);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--panel);width:100%;max-width:520px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out}
.sheet.busy{pointer-events:none;opacity:.6}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h2{font-size:18px}
.x{width:34px;height:34px;border-radius:50%;background:var(--panel2);font-size:15px}
.seg{display:flex;background:var(--panel2);border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.seg button.on.expense{color:var(--red)}.seg button.on.income{color:var(--green)}.seg button.on.saving{color:var(--purple)}
.amount{font-size:30px;font-weight:700;text-align:center;padding:12px;min-height:60px}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:5px 0 12px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.cchip{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);font-size:12px;text-align:center;min-height:64px;justify-content:center;word-break:break-word}
.cchip span{font-size:20px}
.cchip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:inset 0 0 0 1px var(--c)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;color:var(--text);font-size:14px;margin-bottom:14px}
.check input{width:20px;height:20px;min-height:0;margin:0}
.colors{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 14px}
.colors button{width:30px;height:30px;border-radius:50%;background:var(--c)}
.colors button.on{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--c)}

.inbox{border-color:var(--accent)}
.sms{font-size:12px;color:var(--muted);background:var(--panel2);border-radius:10px;padding:8px 10px;margin-bottom:12px;line-height:1.4}
.patrow{margin:-4px 0 14px}
details.rules summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between}
details.rules summary::-webkit-details-marker{display:none}
details.rules[open] summary{margin-bottom:10px}
.rule{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--border)}
.rule:last-child{border-bottom:none}
.rule .mid{flex:1;min-width:0}
.rule .t1{font-size:14px;font-weight:600;word-break:break-all}
.rule .t2{font-size:12px;color:var(--muted)}

/* вход */
body.auth .sidebar, body.auth .bottomnav{display:none}
.login{max-width:360px;margin:12vh auto 0;text-align:center}
.login .logo{width:76px;height:76px;border-radius:22px;margin:0 auto 14px;display:block}
.login h1{font-size:24px;margin-bottom:6px}
.login p{color:var(--muted);font-size:14px;margin-bottom:20px}
.login input{margin-bottom:10px;text-align:center;font-size:17px;min-height:50px}
.login .btn{width:100%;margin-top:4px}
.login .err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
.offline{background:color-mix(in srgb,var(--yellow) 18%,transparent);color:var(--yellow);font-size:13px;border-radius:10px;padding:8px 12px;margin-bottom:12px;text-align:center}

.addrow{display:flex;gap:8px;margin:0 0 12px}
.seg4 button{font-size:13px;padding-left:4px;padding-right:4px}
.money h3 .btn{font-weight:500}
.mgroup{margin-bottom:8px}
.mhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:4px 2px}
.mhead b{color:var(--text)}
.mtotal{border-top:1px solid var(--border);margin-top:6px;padding-top:9px;font-size:15px;color:var(--text)}
.macc{display:flex;justify-content:space-between;width:100%;padding:7px 8px;border-radius:9px;font-size:14px;text-align:left}
.macc:hover{background:var(--panel2)}
.macc .sync{font-style:normal;color:var(--green);font-size:12px}
.addrow .btn{min-height:42px;padding:9px 12px}
.menubtn{width:38px;height:38px;border-radius:10px;font-size:20px;line-height:1;margin-right:6px;vertical-align:middle;background:var(--panel);border:1px solid var(--border)}
.title{display:flex;align-items:center}
.bottomnav,.fab{display:none!important}
.navback{display:none}
.bar{height:4px;background:var(--panel2);border-radius:4px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.hbars{display:flex;align-items:flex-end;gap:4px;height:110px;padding:6px 2px 0}
.hb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.hb i{display:block;width:100%;max-width:22px;background:var(--accent);border-radius:4px 4px 0 0}
.hb span{font-size:10px;color:var(--muted)}
@media (max-width:899px){
  .sidebar{display:flex;flex-direction:column;gap:3px;position:fixed;top:0;left:0;bottom:0;width:270px;max-width:82vw;background:var(--panel);border-right:1px solid var(--border);padding:22px 12px calc(22px + env(safe-area-inset-bottom));z-index:60;transform:translateX(-105%);transition:transform .2s ease;overflow-y:auto}
  .sidebar .btn{flex:none;margin:6px 0 14px}
  body.navopen .sidebar{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.35)}
  body.navopen .navback{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
  .main{padding-bottom:40px}
  .toast{bottom:30px}
}
@media (min-width:900px){.addrow,.menubtn{display:none}}
.filebtn{display:flex;align-items:center;justify-content:center;margin:0;color:inherit;font-size:15px;cursor:pointer}
.btn.primary.filebtn{color:#fff}
textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%;outline:none;margin:8px 0;font-size:13px;resize:vertical}
.qrtext summary{cursor:pointer}
.rcsum{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:var(--panel2);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.rch{font-size:14px;margin:12px 0 8px}
.rcopts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rcitems{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.rcitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border)}
.rcitem:last-child{border-bottom:none}
.rcitem .mid{flex:1;min-width:0}
.rcitem .t1{font-size:13px;line-height:1.25}
.rcitem .t2{font-size:12px;color:var(--muted)}
.rcitem select{width:42%;min-height:36px;padding:6px 8px;font-size:12px;flex:none}
.rctot{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}
.rcmark{font-size:12px;margin-left:4px}
.rcmark.wait{opacity:.55}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#2d333b;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#8e1519}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:70vh;color:var(--muted)}
.spin{width:38px;height:38px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (min-width:900px){
  .bottomnav{display:none}
  .sidebar{display:flex;flex-direction:column;gap:3px;width:240px;flex:none;background:var(--panel);border-right:1px solid var(--border);padding:22px 12px;position:sticky;top:0;height:100vh}
  .sidebar .btn{flex:none;margin:6px 0 14px}
  .main{padding:24px 30px 40px}
  .cards{grid-template-columns:repeat(4,1fr)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .overlay{align-items:center}
  .sheet{border-radius:20px;padding-bottom:18px}
  .cgrid{grid-template-columns:repeat(4,1fr)}
  .toast{bottom:30px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">💰 Бюджет</div>
    <button class="btn primary" data-act="add">+ Добавить операцию</button>
    <button class="btn ghost" data-act="rc-scan" style="flex:none;margin:-8px 0 14px">📷 Чек по QR</button>
    <div id="sidenav"></div>
  </aside>
  <main class="main" id="main"><div class="loader"><div class="spin"></div>Загрузка…</div></main>
</div>
<nav class="bottomnav" id="bottomnav"></nav>
<div class="navback" data-act="navclose"></div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
var MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONTHS_SHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
var WEEKDAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
var TYPES = {
  expense: { one: 'Расход', many: 'Расходы', sign: '−', cls: 'neg' },
  income:  { one: 'Доход', many: 'Доходы', sign: '+', cls: 'pos' },
  saving:  { one: 'Сбережение', many: 'Сбережения', sign: '', cls: 'sav' }
};
var TYPE_KEYS = ['expense', 'income', 'saving'];
var PALETTE = ['#3fb950','#58a6ff','#a371f7','#f778ba','#f85149','#ffa657','#e3b341','#39c5cf','#79c0ff','#db61a2','#bc8cff','#6e7681'];
var NAV = [
  { id: 'home', ic: '📊', t: 'Обзор' },
  { id: 'ops',  ic: '📋', t: 'Операции' },
  { id: 'buy',  ic: '🧺', t: 'Покупки' },
  { id: 'rec',  ic: '🔁', t: 'Регулярные' },
  { id: 'cats', ic: '🏷️', t: 'Категории' }
];

var S = { data: null, view: 'home', ym: ymOf(todayIso()), filter: { type: 'all', cat: '', q: '' }, catTab: 'expense' };
var F = null; // состояние открытой формы

// ---------- утилиты ----------
function pad(n) { return String(n).padStart(2, '0'); }
function todayIso() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function ymOf(iso) { return iso.slice(0, 7); }
function shiftYm(ym, k) {
  var p = ym.split('-').map(Number), y = p[0], m = p[1] + k;
  while (m < 1) { m += 12; y--; }
  while (m > 12) { m -= 12; y++; }
  return y + '-' + pad(m);
}
function ymTitle(ym) { var p = ym.split('-').map(Number); return MONTHS[p[1] - 1] + ' ' + p[0]; }
function ymShort(ym) { var p = ym.split('-').map(Number); return MONTHS_SHORT[p[1] - 1] + ' ' + p[0]; }
function daysIn(ym) { var p = ym.split('-').map(Number); return new Date(p[0], p[1], 0).getDate(); }
function dayTitle(iso) {
  var p = iso.split('-').map(Number);
  var title = p[2] + ' ' + MONTHS_GEN[p[1] - 1];
  if (iso === todayIso()) return title + ', сегодня';
  return title + ', ' + WEEKDAYS[new Date(p[0], p[1] - 1, p[2]).getDay()];
}
function dayShort(iso) { var p = iso.split('-').map(Number); return p[2] + ' ' + MONTHS_GEN[p[1] - 1]; }
function ruleKey(it) {
  var m = String(it.merchant || '').toUpperCase().trim();
  if (/^ПЕРЕВОД/.test(m)) return m.replace(/[.\s]+$/, '').slice(0, 40);
  var k = (m.match(/^[A-ZА-ЯЁ][A-ZА-ЯЁ .'&]*/) || [''])[0].trim();
  return (k.length >= 3 ? k : m).slice(0, 40);
}
function reload() {
  S.buyCache = {};
  return call('getData').then(function (data) { S.data = data; render(); }).catch(function (e) { toast(e, true); });
}
function money(n, sign) {
  var s = (Math.round(n * 100) / 100).toLocaleString('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  return (sign || '') + s + ' ₽';
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function $(sel, root) { return (root || document).querySelector(sel); }
// ---------- связь с сервером (Google Apps Script API) ----------
var LS = { api: 'budget_api', token: 'budget_token', cache: 'budget_cache' };
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }

// Адрес сервера не хранится в коде: его передают один раз в ссылке …/#api=<адрес> и запоминают на устройстве
(function takeApiFromLink() {
  var m = location.hash.match(/api=([^&]+)/);
  if (m) {
    lsSet(LS.api, decodeURIComponent(m[1]));
    history.replaceState(null, '', location.pathname + location.search);
  }
})();

function api(action, params) {
  var url = lsGet(LS.api);
  if (!url) return Promise.reject('Не указан адрес сервера');
  var body = Object.assign({ action: action, token: lsGet(LS.token) || '' }, params || {});
  return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); }, function () { throw 'Нет связи с сервером'; })
    .then(function (res) {
      if (!res || !res.ok) {
        if (res && res.auth) { lsSet(LS.token, null); showLogin(res.error); }
        throw (res && res.error) || 'Ошибка сервера';
      }
      return res.data;
    });
}

// Совместимость со старыми вызовами call('имя', аргументы…)
var ARGS = {
  saveOperation: ['op'], deleteOperation: ['id'], saveCategory: ['cat'], deleteCategory: ['id'],
  saveRecurring: ['rec'], deleteRecurring: ['id'], resolveInbox: ['id', 'op', 'pattern'],
  skipInbox: ['id', 'pattern'], deleteRule: ['id']
};
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1), p = {};
  (ARGS[fn] || []).forEach(function (k, i) { p[k] = args[i]; });
  var pr = api(fn, p);
  if (fn === 'getData') pr = pr.then(function (d) { lsSet(LS.cache, JSON.stringify(d)); S.offline = false; return d; });
  return pr;
}
function toast(msg, isErr) {
  var t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(function () { t.className = 'toast'; }, 2800);
}
function parseAmount(str) {
  var parts = String(str).replace(/[\s ₽]/g, '').replace(/,/g, '.').split('+');
  var sum = 0, any = false;
  for (var i = 0; i < parts.length; i++) {
    if (parts[i] === '') continue;
    var v = Number(parts[i]);
    if (!isFinite(v)) return NaN;
    sum += v; any = true;
  }
  return any ? Math.round(sum * 100) / 100 : NaN;
}

// ---------- данные ----------
function catsOf(type, withArchived) {
  return S.data.cats.filter(function (c) { return c.type === type && (withArchived || !c.archived); })
    .sort(function (a, b) { return (a.archived - b.archived) || (a.order - b.order); });
}
function catInfo(type, name) {
  return S.data.cats.find(function (c) { return c.type === type && c.name === name; }) ||
    { name: name, icon: '•', color: '#6e7681', limit: 0 };
}
function opsOf(ym) { return S.data.ops.filter(function (o) { return o.date.slice(0, 7) === ym; }); }
function total(ops, type) { return ops.reduce(function (s, o) { return s + (o.type === type ? o.amount : 0); }, 0); } // переопределяется в блоке «Счета»
function recFor(ym) {
  return S.data.rec.filter(function (r) { return r.active && r.start <= ym && (!r.end || ym <= r.end); })
    .sort(function (a, b) { return a.day - b.day; });
}
function recTotal(ym, type) { return recFor(ym).reduce(function (s, r) { return s + (r.type === type ? r.amount : 0); }, 0); }
function recDate(r, ym) { return ym + '-' + pad(Math.min(r.day, daysIn(ym))); }
function upsert(list, item) {
  var i = list.findIndex(function (x) { return x.id === item.id; });
  if (i >= 0) list[i] = item; else list.push(item);
}

// ---------- отрисовка ----------
function render(resetScroll) {
  if (!S.data) return;
  document.body.classList.remove('auth');
  renderNav();
  var main = $('#main');
  if (S.view === 'home') main.innerHTML = viewHome();
  else if (S.view === 'ops') { main.innerHTML = viewOps(); renderOpsList(); }
  else if (S.view === 'rec') main.innerHTML = viewRec();
  else if (S.view === 'cats') main.innerHTML = viewCats();
  else if (S.view === 'buy') main.innerHTML = viewBuy();
  else if (S.view === 'acc') main.innerHTML = viewAcc();
  var tt = main.querySelector('.topbar .title');
  if (tt) tt.insertAdjacentHTML('afterbegin', '<button class="menubtn" data-act="menu" aria-label="Меню">☰</button>');
  if (S.offline) main.insertAdjacentHTML('afterbegin', '<div class="offline">Нет связи — показаны сохранённые данные. Изменения пока недоступны.</div>');
  if (resetScroll) window.scrollTo(0, 0);
}

  var b = function (n) {

function monthSwitcher() {
  return '<div class="month"><button data-act="month" data-k="-1" aria-label="Предыдущий месяц">‹</button><span>' + ymTitle(S.ym) +
    '</span><button data-act="month" data-k="1" aria-label="Следующий месяц">›</button></div>';

function viewHome() {
  var ym = S.ym, ops = opsOf(ym), now = todayIso(), curYm = ymOf(now);
  var inc = total(ops, 'income'), exp = total(ops, 'expense'), sav = total(ops, 'saving');
  var pInc = recTotal(ym, 'income'), pExp = recTotal(ym, 'expense'), pSav = recTotal(ym, 'saving');
  var left = inc - exp - sav;

  var html = '<div class="topbar"><div class="title">Обзор</div>' + monthSwitcher() + '</div>' + '<div class="addrow"><button class="btn primary" data-act="add">+ Операция</button><button class="btn ghost" data-act="rc-scan">📷 Чек по QR</button></div>';
  html += '<div class="cards">' +
    card('Доходы', money(inc), 'pos', pInc ? 'план ' + money(pInc) : '') +
    card('Расходы', money(exp), 'neg', pExp ? 'обязательные ' + money(pExp) : '') +
    card('Сбережения', money(sav), 'sav', pSav ? 'цель ' + money(pSav) : '') +
    card('Остаток', money(left), left < 0 ? 'neg' : '', 'доходы − расходы − сбережения') +
    '</div>' + (S.data.accounts ? moneySection() : '');

  // операции из банка, которые нужно разобрать
  var inbox = (S.data.inbox || []).slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
  if (inbox.length) {
    html += '<div class="section inbox"><h3>📥 Из банка — выберите категорию <small>' + inbox.length + '</small></h3>' + inbox.map(function (it) {
      var inc = it.type === 'income';
      return '<button class="item" data-act="inbox" data-id="' + it.id + '"><div class="ico" style="--c:' + (inc ? '#3fb950' : '#f85149') + '">' + (inc ? '⬇️' : '🧾') + '</div>' +
        '<div class="mid"><div class="t1">' + esc(it.merchant) + '</div><div class="t2">' + dayShort(it.date) + ' · нажмите, чтобы разобрать</div></div>' +
        '<div class="amt ' + TYPES[it.type].cls + '">' + money(it.amount, TYPES[it.type].sign) + '</div></button>';
    }).join('') + '</div>';
  }
  var prc = S.data.receipts || [];
  if (prc.length) {
    html += '<div class="section inbox"><h3>🧾 Чеки без пары <small>' + prc.length + '</small></h3>' + prc.map(function (rc) {
      var c0 = rc.candidates && rc.candidates[0];
      var hint = c0 ? (c0.exact ? '<span style="color:var(--green)">нашлась оплата — привязать</span>' : 'есть похожие оплаты — проверьте') : 'ждёт SMS · можно выбрать вручную';
      return '<button class="item" data-act="rc-open" data-id="' + rc.id + '"><div class="ico" style="--c:#d29922">🧾</div>' +
        '<div class="mid"><div class="t1">' + esc(rcTitle(rc)) + '</div><div class="t2">' + rcWhen(rc) + ' · ' + hint + '</div></div>' +
        '<div class="amt neg">' + money(rc.sum, '−') + '</div></button>';
    }).join('') + '</div>';
  }

  // лимиты
  var spent = {};
  ops.forEach(function (o) { if (o.type === 'expense') spent[o.category] = (spent[o.category] || 0) + o.amount; });
  var pace = ym === curYm ? Number(now.slice(8)) / daysIn(ym) : (ym < curYm ? 1 : 0);
  var limited = catsOf('expense', true).filter(function (c) { return c.limit > 0; });
  var limHtml = limited.length ? limited.map(function (c) {
    var s = spent[c.name] || 0, pct = s / c.limit;
    var cls = pct > 1 ? 'over' : (pct > pace + 0.1 ? 'warn' : '');
    var rest = c.limit - s;
    return '<div class="lim"><div class="lim-top"><b>' + esc(c.icon) + ' ' + esc(c.name) + '</b><span>' + money(s) + ' <span class="muted">/ ' + money(c.limit) + '</span></span></div>' +
      '<div class="bar ' + cls + '"><i style="width:' + Math.min(100, pct * 100).toFixed(1) + '%"></i>' +
      (ym === curYm ? '<em style="left:' + (pace * 100).toFixed(1) + '%" title="Сегодня"></em>' : '') + '</div>' +
      '<div class="lim-sub">' + (rest >= 0 ? 'Осталось ' + money(rest) : '<span class="neg">Перерасход ' + money(-rest) + '</span>') + '</div></div>';
  }).join('') : '<div class="empty">Лимиты не заданы.<br><button class="linkbtn" data-act="view" data-v="cats">Задать лимиты в категориях →</button></div>';

  // структура расходов
  var entries = Object.keys(spent).map(function (k) { return [k, spent[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
  var structHtml;
  if (exp > 0) {
    var acc = 0;
    var stops = entries.map(function (e) {
      var c = catInfo('expense', e[0]).color, a = acc / exp * 360;
      acc += e[1];
      return c + ' ' + a.toFixed(2) + 'deg ' + (acc / exp * 360).toFixed(2) + 'deg';
    }).join(',');
    structHtml = '<div class="donut-wrap"><div class="donut" style="background:conic-gradient(' + stops + ')"><div class="hole"><b>' + money(exp) + '</b><span>расходы</span></div></div>' +
      '<div class="legend">' + entries.map(function (e) {
        var c = catInfo('expense', e[0]);
        return '<button class="lg" data-act="goto-cat" data-type="expense" data-name="' + esc(e[0]) + '"><span class="dot" style="background:' + c.color + '"></span><span class="nm">' + esc(c.icon) + ' ' + esc(e[0]) +
          '</span><b>' + money(e[1]) + '</b><span class="pc">' + Math.round(e[1] / exp * 100) + '%</span></button>';
      }).join('') + '</div></div>';
  } else {
    structHtml = '<div class="empty">В этом месяце расходов нет</div>';
  }

  // регулярные платежи месяца
  var rec = recFor(ym), unpaid = 0;
  var recHtml = rec.length ? rec.map(function (r) {
    var paid = ops.find(function (o) { return o.recurringId === r.id; });
    var date = recDate(r, ym);
    var late = !paid && date < now;
    if (!paid && r.type === 'expense') unpaid += r.amount;
    var c = catInfo(r.type, r.category);
    var status = paid ? '<span class="tag ok">✓ ' + money(paid.amount) + '</span>' : (late ? '<span class="tag late">просрочено</span>' : '');
    return '<div class="item"><div class="ico" style="--c:' + c.color + '">' + esc(c.icon) + '</div><div class="mid"><div class="t1">' + esc(r.comment || r.category) + status + '</div>' +
      '<div class="t2">' + Number(date.slice(8)) + ' ' + MONTHS_GEN[Number(date.slice(5, 7)) - 1] + ' · ' + TYPES[r.type].one.toLowerCase() + ' · ' + money(r.amount) + '</div></div>' +
      (paid ? '' : '<button class="paybtn" data-act="pay-rec" data-id="' + r.id + '">Внести</button>') + '</div>';
  }).join('') : '<div class="empty">Нет регулярных платежей.<br><button class="linkbtn" data-act="view" data-v="rec">Добавить →</button></div>';

  // динамика за 6 месяцев и прогноз на 6 месяцев вперёд
  var months = [];
  for (var k = 5; k >= 0; k--) months.push(shiftYm(ym, -k));
  var hist = months.map(function (m) { var o = opsOf(m); return { m: m, inc: total(o, 'income'), exp: total(o, 'expense') }; });
  var trendHtml = lineChart(months, [
    { name: 'Доходы', color: 'var(--green)', values: hist.map(function (d) { return d.inc; }) },
    { name: 'Расходы', color: 'var(--red)', values: hist.map(function (d) { return d.exp; }) }
  ], { current: ym, click: true });
  var fc = forecast();
  var fcHtml = lineChart(fc.months, [
    { name: 'Доходы', color: 'var(--green)', values: fc.inc, dashed: true },
    { name: 'Расходы', color: 'var(--red)', values: fc.exp, dashed: true }
  ], { current: curYm }) + fc.note;

  html += '<div class="grid2">' +
    '<div class="section"><h3>Лимиты по категориям</h3>' + limHtml + '</div>' +
    '<div class="section"><h3>Структура расходов</h3>' + structHtml + '</div>' +
    '</div><div class="grid2">' +
    '<div class="section"><h3>Регулярные платежи' + (unpaid ? ' <small>осталось внести ' + money(unpaid) + '</small>' : '') + '</h3>' + recHtml + '</div>' +
    '<div class="section"><h3>Динамика за полгода</h3>' + trendHtml + '</div>' +
    '</div>' +
    '<div class="section"><h3>Прогноз на полгода <small>план + средние траты</small></h3>' + fcHtml + '</div>';
  return html;
}

// --- линейный график (SVG) ---
function shortMoney(v) {
  var a = Math.abs(v);
  if (a >= 1e6) return (Math.round(v / 1e5) / 10).toString().replace('.', ',') + ' млн';
  if (a >= 1e3) return Math.round(v / 1e3) + ' тыс';
  return String(Math.round(v));
}
function lineChart(months, series, opt) {
  opt = opt || {};
  var W = 360, H = 190, L = 40, R = 16, T = 10, B = 22, n = months.length;
  var max = Math.max.apply(null, series.reduce(function (a, s) { return a.concat(s.values); }, [1]));
  var step = Math.pow(10, Math.floor(Math.log10(max))), nice = Math.ceil(max / step) * step;
  if (nice / step > 6) step *= 2; else if (nice / step <= 2) step /= 2;
  nice = Math.ceil(max / step) * step;
  var x = function (i) { return L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)); };
  var y = function (v) { return T + (H - T - B) * (1 - v / nice); };
  var svg = '<svg class="lchart" viewBox="0 0 ' + W + ' ' + H + '">';
  for (var g = 0; g <= nice + 0.001; g += step) {
    svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g) + '" y2="' + y(g) + '" class="grid"/><text x="' + (L - 6) + '" y="' + (y(g) + 4) + '" class="ylab">' + shortMoney(g) + '</text>';
  }
  months.forEach(function (m, i) {
    svg += '<text x="' + x(i) + '" y="' + (H - 8) + '" class="xlab' + (m === opt.current ? ' cur' : '') + '">' + MONTHS_SHORT[Number(m.slice(5)) - 1] + '</text>';
  });
  series.forEach(function (s) {
    var pts = s.values.map(function (v, i) { return x(i) + ',' + y(v); }).join(' ');
    svg += '<polyline points="' + pts + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round"' + (s.dashed ? ' stroke-dasharray="7 5"' : '') + '/>';
    s.values.forEach(function (v, i) {
      svg += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="3.2" fill="var(--panel)" stroke="' + s.color + '" stroke-width="1.8"><title>' + s.name + ', ' + ymTitle(months[i]) + ': ' + money(v) + '</title></circle>';
    });
  });
  if (opt.click) months.forEach(function (m, i) {
    var w = (W - L - R) / Math.max(1, n - 1);
    svg += '<rect x="' + (x(i) - w / 2) + '" y="0" width="' + w + '" height="' + H + '" fill="transparent" data-act="set-month" data-ym="' + m + '" style="cursor:pointer"><title>' +
      ymTitle(m) + ': ' + series.map(function (s) { return s.name.toLowerCase() + ' ' + money(s.values[i]); }).join(', ') + '</title></rect>';
  });
  svg += '</svg>';
  return svg + '<div class="tlegend">' + series.map(function (s) {
    return '<span><i style="background:' + s.color + '"></i>' + s.name + '</span>';
  }).join('') + '</div>';
}
// прогноз: регулярные платежи + средние нерегулярные доходы/расходы за последние 3 полных месяца
function forecast() {
  var cur = ymOf(todayIso()), months = [], inc = [], exp = [], sav = [];
  // категории, у которых есть регулярный платёж, в «средние траты» не берём — их покрывает план
  var planned = {};
  S.data.rec.forEach(function (r) { if (r.active) planned[r.type + '|' + r.category] = 1; });
  var isVar = function (o, type) { return o.type === type && !o.recurringId && !planned[type + '|' + o.category]; };
  var avg = function (type) {
    var s = 0;
    for (var k = 1; k <= 3; k++) opsOf(shiftYm(cur, -k)).forEach(function (o) { if (isVar(o, type)) s += o.amount; });
    return s / 3;
  };
  var varInc = avg('income'), varExp = avg('expense');
  for (var k = 0; k < 6; k++) {
    var m = shiftYm(cur, k), rec = recFor(m);
    var pl = { income: 0, expense: 0, saving: 0 };
    if (k === 0) {
      var ops = opsOf(m);
      // платёж уже внесён, если есть операция по нему или в той же категории (например, зарплата пришла из SMS)
      rec.forEach(function (r) {
        var paid = ops.some(function (o) { return o.recurringId === r.id || (o.type === r.type && o.category === r.category && !o.recurringId); });
        if (!paid) pl[r.type] += r.amount;
      });
      var actVarExp = ops.reduce(function (a, o) { return a + (isVar(o, 'expense') ? o.amount : 0); }, 0);
      var actVarInc = ops.reduce(function (a, o) { return a + (isVar(o, 'income') ? o.amount : 0); }, 0);
      inc.push(total(ops, 'income') + pl.income + Math.max(0, varInc - actVarInc));
      exp.push(total(ops, 'expense') + pl.expense + Math.max(0, varExp - actVarExp));
      sav.push(total(ops, 'saving') + pl.saving);
    } else {
      rec.forEach(function (r) { pl[r.type] += r.amount; });
      inc.push(pl.income + varInc); exp.push(pl.expense + varExp); sav.push(pl.saving);
    }
    months.push(m);
  }
  var free = inc.reduce(function (a, v, i) { return a + v - exp[i] - sav[i]; }, 0);
  var savSum = sav.reduce(function (a, v) { return a + v; }, 0);
  var note = '<div class="fcnote">За 6 месяцев: доходы <b class="pos">' + money(inc.reduce(function (a, v) { return a + v; }, 0)) + '</b>, расходы <b class="neg">' +
    money(exp.reduce(function (a, v) { return a + v; }, 0)) + '</b>' + (savSum ? ', отложить <b class="sav">' + money(savSum) + '</b>' : '') +
    '. Свободный остаток: <b class="' + (free < 0 ? 'neg' : 'pos') + '">' + money(free) + '</b> (≈ ' + money(free / 6) + ' в месяц).' +
    '<br><span class="muted">Нерегулярные траты взяты как среднее за 3 прошлых месяца: ' + money(varExp) + ' в месяц' + (varInc ? ', нерегулярные доходы — ' + money(varInc) : '') + '.</span></div>';
  if (free < 0) note += '<div class="fcwarn">⚠️ По прогнозу расходы и сбережения превышают доходы — стоит пересмотреть лимиты или регулярные платежи.</div>';
  return { months: months, inc: inc, exp: exp, note: note };
}

function card(lbl, val, cls, sub) {
  return '<div class="card"><div class="lbl">' + lbl + '</div><div class="val ' + (cls || '') + '">' + val + '</div><div class="sub">' + (sub || '&nbsp;') + '</div></div>';
}

function viewOps() {
  var f = S.filter;
  var names = {};
  opsOf(S.ym).forEach(function (o) { if (f.type === 'all' || o.type === f.type) names[o.type + '|' + o.category] = [o.type, o.category]; });
  TYPE_KEYS.forEach(function (t) {

    '<div class="chips">' + [['all', 'Все']].concat(TYPE_KEYS.concat(['transfer']).map(function (t) { return [t, TYPES[t].many]; })).map(function (c) {

    }).join('') + '<button class="chip' + (f.noRcpt ? ' on' : '') + '" data-act="fnorc">📷 Без чека ' + opsOf(S.ym).filter(needsReceipt).length + '</button></div>' +

function renderOpsList() {
  var f = S.filter, q = f.q.trim().toLowerCase();
  var list = opsOf(S.ym).filter(function (o) {
    if (f.type !== 'all' && o.type !== f.type) return false;
    if (f.noRcpt && !needsReceipt(o)) return false;
    if (f.cat && f.cat !== o.type + '|' + o.category) return false;
    if (q && (o.category + ' ' + o.comment).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(function (a, b) { return b.date.localeCompare(a.date); });

  var box = $('#opsList');
  if (!box) return;
  if (!list.length) {
    box.innerHTML = '<div class="section"><div class="empty">Операций нет.<br>Нажмите «+», чтобы добавить.</div></div>';
    return;
  }
  var sums = TYPE_KEYS.map(function (t) { return [t, total(list, t)]; }).filter(function (x) { return x[1] > 0; });
  var html = '<div class="summary"><span><b>' + list.length + '</b> операций</span>' + sums.map(function (x) {
    return '<span>' + TYPES[x[0]].many + ': <b class="' + TYPES[x[0]].cls + '">' + money(x[1]) + '</b></span>';
  }).join('') + '</div><div class="section">';
  var day = '';
  list.forEach(function (o) {
    if (o.date !== day) {
      day = o.date;
      var dayExp = total(list.filter(function (x) { return x.date === day; }), 'expense');
      html += '<div class="dayhead"><span>' + dayTitle(day) + '</span><span>' + (dayExp ? money(dayExp, '−') : '') + '</span></div>';
    }
    var c = o.type === 'transfer' ? { icon: '🔄', color: '#58a6ff' } : o.type === 'adjust' ? { icon: '⚖️', color: '#8b949e' } : catInfo(o.type, o.category);
    if (o.type === 'transfer' || o.type === 'adjust') {
      html += '<button class="item" data-act="' + (o.type === 'transfer' ? 'edit-op' : 'acc-open') + '" data-id="' + (o.type === 'transfer' ? o.id : accOf(o)) + '"><div class="ico" style="--c:' + c.color + '">' + c.icon + '</div>' +
        '<div class="mid"><div class="t1">' + TYPES[o.type].one + '</div><div class="t2">' + esc(o.type === 'transfer' ? accName(accOf(o)) + ' → ' + accName(o.toAccount) : accName(accOf(o)) + (o.comment ? ' · ' + o.comment : '')) + '</div></div>' +
        '<div class="amt">' + (o.type === 'adjust' ? (o.amount > 0 ? '+' : '−') + money(Math.abs(o.amount)) : money(o.amount)) + '</div></button>';
      return;
    }
    html += '<button class="item" data-act="edit-op" data-id="' + o.id + '"><div class="ico" style="--c:' + c.color + '">' + esc(c.icon) + '</div>' +
      '<div class="mid"><div class="t1">' + esc(o.category) + (o.receiptId ? '<span class="rcmark" title="Есть чек">🧾</span>' : needsReceipt(o) ? '<span class="rcmark wait" title="Нет чека">📷</span>' : '') + '</div>' + (o.comment ? '<div class="t2">' + esc(o.comment) + '</div>' : '') + '</div>' +
      '<div class="amt ' + TYPES[o.type].cls + '">' + money(o.amount, TYPES[o.type].sign) + '</div></button>';
  });
  box.innerHTML = html + '</div>';
}

function viewRec() {

      return '<div class="rule"><div class="mid"><div class="t1">' + esc(r.pattern) + '</div><div class="t2">' + what + '</div></div>' +

    '<p class="muted small" style="margin-bottom:8px">Если название товара в чеке содержит шаблон — товар сразу попадёт в категорию. Создаются галочкой «Запомнить» при разборе чека.</p>' +
    (irules.length ? irules.map(function (r) {
      return '<div class="rule"><div class="mid"><div class="t1">' + esc(r.pattern) + '</div><div class="t2">→ ' + esc(r.category) + '</div></div>' +
        '<button class="x" data-act="irule-del" data-id="' + r.id + '" aria-label="Удалить">✕</button></div>';

  html += '<p class="small muted" style="text-align:center;margin-top:16px">Все данные хранятся в вашей Google Таблице: <a href="' + esc(S.data.sheetUrl) + '" target="_blank">открыть таблицу</a></p>';

// ---------- модальное окно ----------
function openSheet(html) {
  $('#sheet').innerHTML = html;
  $('#sheet').classList.remove('busy');
  $('#overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  $('#overlay').classList.remove('open');
  document.body.style.overflow = '';
  F = null;
}
function busy(on) { $('#sheet').classList.toggle('busy', on); }
function sheetHead(title) { return '<div class="sheet-head"><h2>' + title + '</h2><button class="x" data-act="close" aria-label="Закрыть">✕</button></div>'; }
function segHtml(cur, act) {
  return '<div class="seg">' + TYPE_KEYS.map(function (t) {
    return '<button class="' + (cur === t ? 'on ' + t : '') + '" data-act="' + act + '" data-t="' + t + '">' + TYPES[t].one + '</button>';
  }).join('') + '</div>';
}
function val(id) { var el = $('#' + id); return el ? el.value : ''; }

// --- операция ---
function openOpForm(init) {
  F = Object.assign({ kind: 'op', id: '', type: 'expense', date: todayIso(), amount: '', category: '', comment: '', recurringId: '', account: '', toAccount: '' }, init || {});
  if (typeof F.amount === 'number') F.amount = String(F.amount).replace('.', ',');
  if (S.data.accounts) fillAccDefaults(false);
  renderOpForm(!F.id);
}
function syncOpForm() {
  if (!F || F.kind !== 'op' || !$('#f-amount')) return;
  F.amount = val('f-amount'); F.date = val('f-date'); F.comment = val('f-comment');
  if ($('#f-acc')) F.account = val('f-acc');
  if ($('#f-acc2')) F.toAccount = val('f-acc2');
  if (F.inboxId && $('#f-rem')) { F.remember = $('#f-rem').checked; F.rulePattern = val('f-pat'); }
}
function renderOpForm(focus) {
  var list = catsOf(F.type);
  if (F.category && !list.some(function (c) { return c.name === F.category; })) list = list.concat([catInfo(F.type, F.category)]);
  openSheet(sheetHead(F.inboxId ? 'Операция из банка' : (F.id ? 'Изменить операцию' : 'Новая операция')) +
    (F.inboxId ? '<div class="sms">' + esc(F.smsText) + '</div>' : '') +
    rcFormButtons() +
    (S.data.accounts ? opSegHtml() : segHtml(F.type, 'op-type')) +
    '<input id="f-amount" class="amount" inputmode="decimal" placeholder="0 ₽" autocomplete="off" value="' + esc(F.amount) + '">' +
    '<div class="hint">Можно сложить несколько сумм: 350+120</div>' +
    (F.type === 'transfer' ? '' : '<div class="cgrid">' + list.map(function (c) {
      return '<button class="cchip' + (F.category === c.name ? ' on' : '') + '" style="--c:' + c.color + '" data-act="op-cat" data-name="' + esc(c.name) + '"><span>' + esc(c.icon) + '</span>' + esc(c.name) + '</button>';
    }).join('') + '</div>') +
    (S.data.accounts ? accountFields() : '') +
    '<div class="row2"><label>Дата<input id="f-date" type="date" value="' + esc(F.date) + '"></label>' +
    '<label>Комментарий<input id="f-comment" maxlength="200" placeholder="Необязательно" value="' + esc(F.comment) + '"></label></div>' +
    (F.inboxId ?
      '<label class="check"><input type="checkbox" id="f-rem"' + (F.remember ? ' checked' : '') + '>Запомнить для всех SMS, где есть текст:</label>' +
      '<input id="f-pat" class="patrow" maxlength="60" value="' + esc(F.rulePattern) + '">' +
      '<div class="actions"><button class="btn ghost" data-act="inbox-skip">Пропустить</button><button class="btn primary" data-act="op-save">Добавить</button></div>'
    :
    '<div class="actions">' + (F.id ? '<button class="btn danger" data-act="op-del">Удалить</button>' : '<button class="btn ghost" data-act="op-save" data-more="1">Сохранить и ещё</button>') +
    '<button class="btn primary" data-act="op-save">Сохранить</button></div>'));
  if (focus) setTimeout(function () { var a = $('#f-amount'); if (a) a.focus(); }, 60);
}
function rcFormButtons() {
  if (!S.data) return '';
  if (!F.id && !F.inboxId) return '<div class="actions" style="margin:-4px 0 12px"><button class="btn ghost small" data-act="rc-scan">📷 Чек по QR</button></div>';
  if (F.type !== 'expense') return '';
  if (F.inboxId) {
    var hint = (S.data.receipts || []).find(function (rc) { return (rc.candidates || []).some(function (c) { return c.kind === 'inbox' && c.id === F.inboxId; }); });
    return '<div class="actions" style="margin:-4px 0 12px">' +
      (hint ? '<button class="btn primary small" data-act="rc-hint" data-id="' + hint.id + '">🧾 Есть чек ' + esc(rcTitle(hint)) + ' — привязать</button>' : '') +
      '<button class="btn ghost small" data-act="rc-op">📷 Чек</button></div>';
  }
  var o = S.data.ops.find(function (x) { return x.id === F.id; }) || {};
  if (o.receiptId) { F.receiptId = o.receiptId; return '<div class="actions" style="margin:-4px 0 12px"><button class="btn ghost small" data-act="rc-view">🧾 Чек — состав покупки</button></div>'; }
  return '<div class="actions" style="margin:-4px 0 12px"><button class="btn ghost small" data-act="rc-op">📷 Добавить чек</button>' +
    '<button class="btn ghost small" data-act="rc-nn">' + (o.noReceipt ? '↩︎ Снова ждать чек' : 'Чек не нужен') + '</button></div>';
}
function saveOp(more) {
  syncOpForm();
  var amount = parseAmount(F.amount);
  if (!(amount > 0)) return toast('Введите сумму', true);
  if (F.type === 'transfer') {
    F.category = 'Перевод';
    if (!F.account || !F.toAccount) return toast('Выберите оба счёта', true);
    if (F.account === F.toAccount) return toast('Счета должны различаться', true);
  }
  if (!F.category) return toast('Выберите категорию', true);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(F.date)) return toast('Укажите дату', true);
  busy(true);
  if (F.inboxId) {
    var pattern = F.remember ? String(F.rulePattern || '').trim() : '';
    call('resolveInbox', F.inboxId, { type: F.type, date: F.date, amount: amount, category: F.category, comment: F.comment, account: F.account, toAccount: F.toAccount }, pattern)
      .then(function () { closeSheet(); toast(pattern ? 'Добавлено, правило запомнено' : 'Добавлено'); return reload(); })
      .catch(function (e) { busy(false); toast(e, true); });
    return;
  }
  call('saveOperation', { id: F.id, type: F.type, date: F.date, amount: amount, category: F.category, comment: F.comment, recurringId: F.recurringId, account: F.account, toAccount: F.toAccount })
    .then(function (saved) {
      upsert(S.data.ops, saved);
      toast(more ? 'Сохранено — вводите следующую' : 'Сохранено');
      if (more) {
        F = Object.assign(F, { id: '', amount: '', comment: '', recurringId: '', category: '' });
        renderOpForm(true);
      } else {
        closeSheet();
      }
      render();
    })
    .catch(function (e) { busy(false); toast(e, true); });
}
function deleteOp(btn) {
  if (!btn.dataset.sure) { btn.dataset.sure = '1'; btn.textContent = 'Точно удалить?'; return; }
  busy(true);
  var id = F.id;
  call('deleteOperation', id).then(function () {
    S.data.ops = S.data.ops.filter(function (o) { return o.id !== id; });
    S.buyCache = {}; // товары из чека этой операции тоже удалены
    closeSheet(); render(); toast('Удалено');
  }).catch(function (e) { busy(false); toast(e, true); });
}

// --- категория ---
function openCatForm(cat) {
  F = Object.assign({ kind: 'cat', id: '', type: S.catTab, name: '', icon: '📦', color: PALETTE[0], limit: '', archived: false, waitReceipt: false }, cat || {});

  var a = $('#c-arch'); if (a) F.archived = a.checked;
  var w = $('#c-wait'); if (w) F.waitReceipt = w.checked;
}
function renderCatForm() {
  openSheet(sheetHead(F.id ? 'Категория' : 'Новая категория') +
    (F.id ? '' : segHtml(F.type, 'cat-type')) +
    '<div class="row2" style="grid-template-columns:80px 1fr"><label>Иконка<input id="c-icon" maxlength="4" style="text-align:center;font-size:20px" value="' + esc(F.icon) + '"></label>' +
    '<label>Название<input id="c-name" maxlength="40" value="' + esc(F.name) + '"></label></div>' +
    '<label>Цвет</label><div class="colors">' + PALETTE.map(function (c) {
      return '<button class="' + (F.color === c ? 'on' : '') + '" style="--c:' + c + '" data-act="cat-color" data-c="' + c + '" aria-label="' + c + '"></button>';
    }).join('') + '</div>' +
    (F.type === 'expense' ? '<label>Лимит в месяц, ₽<input id="c-limit" inputmode="decimal" placeholder="Без лимита" value="' + esc(F.limit) + '"></label>' +
      '<label class="check"><input type="checkbox" id="c-wait"' + (F.waitReceipt ? ' checked' : '') + '>Ждать чек по покупкам (фильтр «Без чека»)</label>' : '') +
    (F.id ? '<label class="check"><input type="checkbox" id="c-arch"' + (F.archived ? ' checked' : '') + '>В архиве (скрыть при вводе)</label>' : '') +
    '<div class="actions">' + (F.id ? '<button class="btn danger" data-act="cat-del">Удалить</button>' : '') +
    '<button class="btn primary" data-act="cat-save">Сохранить</button></div>');
}
function saveCat() {
  syncCatForm();
  if (!F.name.trim()) return toast('Введите название', true);
  var limit = F.limit === '' ? 0 : parseAmount(F.limit);
  if (isNaN(limit) || limit < 0) return toast('Неверный лимит', true);
  var old = F.id ? S.data.cats.find(function (c) { return c.id === F.id; }) : null;
  busy(true);

function showLogin(msg) {
  closeSheet();

  var hasApi = !!lsGet(LS.api);
  $('#main').innerHTML = '<div class="login"><img class="logo" src="icons/icon-192.png" alt=""><h1>Бюджет</h1>' +
    '<p id="l-hint">' + (hasApi ? 'Введите пароль' : 'Укажите адрес сервера и пароль') + '</p>' +

    '<input id="l-pass" type="password" placeholder="Пароль" autocomplete="current-password">' +
    '<button class="btn primary" data-act="login">Войти</button><div class="err" id="l-err">' + esc(msg || '') + '</div></div>';
  if (hasApi) {
    api('status').then(function (st) {
      if (st && !st.hasPassword) {
        $('#l-hint').textContent = 'Первый вход: придумайте пароль (от 6 символов). Он станет паролем приложения.';
        $('#l-pass').autocomplete = 'new-password';

  }

function doLogin() {
  var apiInput = $('#l-api');
  if (apiInput) {
    var url = apiInput.value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(url)) { $('#l-err').textContent = 'Проверьте адрес сервера'; return; }
    lsSet(LS.api, url);
  }

  if (!pass) { $('#l-err').textContent = 'Введите пароль'; return; }
  $('#l-err').textContent = '';
  var btn = document.querySelector('[data-act=login]');
  btn.disabled = true; btn.textContent = 'Вход…';
  api('login', { password: pass }).then(function (res) {
    lsSet(LS.token, res.token);
    return call('getData');
  }).then(function (data) {
    S.data = data; render(true);
  }).catch(function (e) {
    btn.disabled = false; btn.textContent = 'Войти';

function savePassword() {

  if (n.length < 6) return toast('Новый пароль — от 6 символов', true);
  if (n !== n2) return toast('Пароли не совпадают', true);
  busy(true);
  api('changePassword', { oldPassword: o, newPassword: n }).then(function (res) {
    lsSet(LS.token, res.token); closeSheet(); toast('Пароль изменён');
  }).catch(function (e) { busy(false); toast(e, true); });
}

// ---------- запуск ----------
document.addEventListener('DOMContentLoaded', function start() {
  if (!lsGet(LS.api) || !lsGet(LS.token)) { showLogin(); return; }
  // сразу показываем последние сохранённые данные, затем обновляем с сервера
  var cached = lsGet(LS.cache);
  if (cached) { try { S.data = JSON.parse(cached); render(); } catch (e) {} }
  call('getData').then(function (data) {
    S.data = data; render(); handleShare();
  }).catch(function (e) {
    if (!lsGet(LS.token)) return; // уже показан экран входа
    if (S.data) { S.offline = true; render(); }
    else $('#main').innerHTML = '<div class="section"><div class="empty">Не удалось загрузить данные:<br>' + esc(e) + '<br><br><button class="btn primary small" onclick="location.reload()">Повторить</button></div></div>';
  });
});

<script>
// ======================= Чеки по QR =======================
var RC_OK_KIND = /покупк|оплат|чек/i;

// Ждём ли чек по этой операции: расход по «чековой» категории, вид из банка — покупка/оплата
function needsReceipt(o) {
  if (o.type !== 'expense' || o.receiptId || o.noReceipt) return false;
  if (!catInfo('expense', o.category).waitReceipt) return false;
  return !o.kind || RC_OK_KIND.test(o.kind);
}
function rcTitle(rc) { return rc.store || 'Чек'; }
function rcWhen(rc) { return (rc.date ? dayShort(rc.date) : '') + (rc.time ? ', ' + rc.time : ''); }
function rcSummary(rc) {
  return '<div class="rcsum"><div><b>' + esc(rcTitle(rc)) + '</b><div class="muted small">' + rcWhen(rc) + '</div></div><b>' + money(rc.sum) + '</b></div>' +
    (rc.error ? '<div class="sms">⚠️ ' + esc(rc.error) + '</div>' : '');
}
function expCatOptions(cur, emptyLabel) {
  return '<option value="">' + emptyLabel + '</option>' + catsOf('expense').map(function (c) {
    return '<option value="' + esc(c.name) + '"' + (cur === c.name ? ' selected' : '') + '>' + esc(c.icon + ' ' + c.name) + '</option>';
  }).join('');
}

// ---------- распознавание QR ----------
function loadJsQR() {
  if (window.jsQR) return Promise.resolve(window.jsQR);
  return new Promise(function (ok, fail) {
    var s = document.createElement('script');
    s.src = 'jsQR.js';
    s.onload = function () { ok(window.jsQR); };
    s.onerror = function () { fail('Не удалось загрузить распознавание QR'); };
    document.head.appendChild(s);
  });
}
// Картинку открываем двумя способами: createImageBitmap не понимает часть форматов на Android
function loadImage(file) {
  var viaImg = function () {
    return new Promise(function (ok, fail) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () { ok({ src: img, w: img.naturalWidth, h: img.naturalHeight, done: function () { URL.revokeObjectURL(url); } }); };
      img.onerror = function () { URL.revokeObjectURL(url); fail(); };
      img.src = url;
    });
  };
  var p = window.createImageBitmap ?
    createImageBitmap(file).then(function (b) { return { src: b, w: b.width, h: b.height, done: function () {} }; }).catch(viaImg) : viaImg();
  return p.catch(function () {
    throw 'Не удалось открыть картинку' + (file.type ? ' (' + file.type + ')' : '') + '. Сделайте обычный скриншот экрана (PNG/JPG) или сфотографируйте QR камерой.';
  });
}
function decodeQrFile(file) {
  if (!file || !file.size) return Promise.reject('Файл пустой — возможно, он ещё не скачан из облака. Откройте его в галерее и попробуйте снова.');
  return loadImage(file).then(function (im) {
    // рисуем на холст — его понимают и BarcodeDetector, и jsQR
    var side = Math.max(im.w, im.h);
    var canvasAt = function (target) {
      var k = Math.min(1, target / side), w = Math.max(1, Math.round(im.w * k)), h = Math.max(1, Math.round(im.h * k));
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(im.src, 0, 0, w, h);
      return { cv: cv, cx: cx, w: w, h: h };
    };
    var first = canvasAt(2400);
    var native = ('BarcodeDetector' in window) ?
      BarcodeDetector.getSupportedFormats().then(function (f) {
        if (f.indexOf('qr_code') < 0) return '';
        return new BarcodeDetector({ formats: ['qr_code'] }).detect(first.cv).then(function (r) {
          var hit = r.find(function (x) { return /t=\d{8}T/i.test(x.rawValue); }) || r[0];
          return hit ? hit.rawValue : '';
        });
      }).catch(function () { return ''; }) : Promise.resolve('');
    return native.then(function (txt) {
      if (txt) return txt;
      return loadJsQR().then(function (jsQR) {
        var sizes = [2400, 1400, 900];
        for (var i = 0; i < sizes.length; i++) {
          var c = i === 0 ? first : canvasAt(sizes[i]);
          if (i > 0 && c.w === first.w) continue;
          var res = jsQR(c.cx.getImageData(0, 0, c.w, c.h).data, c.w, c.h, { inversionAttempts: 'attemptBoth' });
          if (res && res.data) return res.data;
        }
        return '';
      });
    }).then(function (txt) { im.done(); return txt; });
  }).then(function (txt) {
    if (!txt) throw 'QR-код не найден. Сфотографируйте его крупнее и ровнее или обрежьте скриншот до QR-кода.';
    return txt;
  }, function (e) { throw typeof e === 'string' ? e : 'Не удалось прочитать картинку: ' + (e && e.message || e); });
}

// ---------- шаг 1: выбрать фото/скриншот ----------
function openScan(target) {

    '<p class="muted small" style="margin-bottom:12px">Сфотографируйте QR-код на чеке или выберите скриншот чека из Ozon, Купера и т.п.</p>' +
    '<div class="actions" style="margin-bottom:12px"><label class="btn primary filebtn">📷 Камера<input type="file" id="qr-cam" accept="image/*" capture="environment" hidden></label>' +
    '<label class="btn ghost filebtn">🖼 Скриншот<input type="file" id="qr-file" accept="image/*" hidden></label></div>' +
    '<details class="qrtext"><summary class="muted small">Ввести строку QR вручную</summary>' +
    '<textarea id="qr-raw" rows="3" placeholder="t=20251110T1536&s=1995.37&fn=…&i=…&fp=…&n=1"></textarea>' +
    '<div class="actions"><button class="btn ghost" data-act="rc-raw">Найти чек</button></div></details>' +
    (S.data.receiptsEnabled ? '' : '<p class="muted small" style="margin-top:12px">Сервис чеков ещё не подключён: сохранятся сумма и дата, без списка товаров.</p>'));
}
function submitQr(text) {
  text = String(text || '').trim();
  if (!/t=\d{8}T\d{4}/i.test(text)) return toast('Это не QR-код кассового чека', true);
  if (F && F.kind === 'rcpt') busy(true);
  else F = { kind: 'rcpt', target: null };

  return api('scanReceipt', { qr: text }).then(function (res) {
    F.receipt = res.receipt; F.candidates = res.candidates || [];

    if (F.target) return goSplit(F.target);
    if (F.candidates.length) renderMatch(); else renderNoPair();

// ---------- шаг 2: пара ----------
function candHtml(c, i, act) {
  var note = c.exact ? 'сумма совпадает' : 'сумма в банке ' + (c.diff > 0 ? 'больше' : 'меньше') + ' на ' + money(Math.abs(c.diff));
  return '<button class="item" data-act="' + act + '" data-i="' + i + '"><div class="ico" style="--c:' + (c.kind === 'inbox' ? '#2f81f7' : '#3fb950') + '">' + (c.kind === 'inbox' ? '📥' : '💳') + '</div>' +
    '<div class="mid"><div class="t1">' + esc(c.title) + '</div><div class="t2">' + dayShort(c.date) + ' · ' + (c.kind === 'inbox' ? 'из банка, не разобрана' : esc(c.category)) + ' · ' + note + '</div></div>' +
    '<div class="amt neg">' + money(c.amount, '−') + '</div></button>';
}
function renderMatch() {
  var c0 = F.candidates[0];

    '<h4 class="rch">' + (c0.exact && c0.score >= 100 ? 'Похоже, это оплата:' : 'Возможные оплаты — выберите:') + '</h4>' +
    '<div class="section" style="padding:6px">' + F.candidates.map(function (c, i) { return candHtml(c, i, 'rc-pick'); }).join('') + '</div>' +
    noPairButtons());
}
function noPairButtons() {
  return '<div class="rcopts">' +
    '<button class="btn ghost" data-act="rc-manual">Выбрать операцию вручную</button>' +
    '<button class="btn ghost" data-act="rc-new">Создать операцию из чека</button>' +
    '<button class="btn ghost" data-act="rc-later">Отложить — дождусь SMS</button>' +
    (F.receipt.status !== 'привязан' ? '<button class="btn danger" data-act="rc-del">Удалить чек</button>' : '') + '</div>';
}
function renderNoPair() {
  openSheet(sheetHead('Пара не найдена') + rcSummary(F.receipt) +
    '<div class="sms">Не нашёл расход на эту сумму с ' + dayShort(shiftDay(F.receipt.date, -3)) + ' по ' + dayShort(shiftDay(F.receipt.date, 1)) + '. ' +
    'Возможно, SMS ещё не пришла, оплата была в другой день, или сумма в банке отличается (частичный возврат, оплата баллами, несколько чеков на одну оплату). ' +
    'Посмотрите список вручную — если причина в другом, расскажите, поправлю поиск.</div>' + noPairButtons());
}
function shiftDay(iso, k) {
  var p = iso.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2] + k);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function renderManual() {
  var rc = F.receipt, from = shiftDay(rc.date, -10), to = shiftDay(rc.date, 5);
  var list = S.data.ops.filter(function (o) { return o.type === 'expense' && !o.receiptId && o.date >= from && o.date <= to; })
    .map(function (o) { return { kind: 'op', id: o.id, date: o.date, amount: o.amount, title: o.comment || o.category, category: o.category }; })
    .concat((S.data.inbox || []).filter(function (it) { return it.type === 'expense'; })
      .map(function (it) { return { kind: 'inbox', id: it.id, date: it.date, amount: it.amount, title: it.merchant, category: '' }; }));
  list.forEach(function (c) { c.diff = Math.round((c.amount - rc.sum) * 100) / 100; c.exact = Math.abs(c.diff) < 0.01; });
  list.sort(function (a, b) { return Math.abs(a.diff) - Math.abs(b.diff); });
  F.manual = list.slice(0, 30);
  openSheet(sheetHead('Выберите операцию') + rcSummary(rc) +
    '<p class="muted small" style="margin-bottom:8px">Расходы без чека с ' + dayShort(from) + ' по ' + dayShort(to) + ', ближайшие по сумме сверху.</p>' +
    '<div class="section" style="padding:6px">' + (F.manual.length ? F.manual.map(function (c, i) { return candHtml(c, i, 'rc-pick-m'); }).join('') : '<div class="empty">Подходящих операций нет</div>') + '</div>' +
    '<div class="actions"><button class="btn ghost" data-act="rc-back">Назад</button><button class="btn ghost" data-act="rc-new">Создать из чека</button></div>' +
    '<div class="actions"><button class="btn ghost" data-act="rc-later">Отложить — дождусь SMS</button></div>');
}

// ---------- шаг 3: разнести по категориям ----------
function goSplit(target) {
  var rc = F.receipt, op = null, it = null;
  if (target.kind === 'op') op = S.data.ops.find(function (o) { return o.id === target.id; });
  if (target.kind === 'inbox') it = (S.data.inbox || []).find(function (x) { return x.id === target.id; });
  F.target = target;
  F.bank = op ? op.amount : it ? it.amount : rc.sum;
  F.targetTitle = op ? (op.comment || op.category) : it ? it.merchant : 'новая операция';
  F.main = target.category || (op && catInfo('expense', op.category).waitReceipt ? op.category : (op ? op.category : ''));
  F.itemCats = (rc.items || []).map(function (x) { return x.cat || ''; });

}
function splitParts() {

    by[c] = Math.round(((by[c] || 0) + x.sum) * 100) / 100;

}
function totalsHtml() {
  var parts = splitParts(), diff = Math.round((F.bank - F.receipt.sum) * 100) / 100;
  return parts.map(function (p) {
    var c = catInfo('expense', p.category);
    return '<div class="rctot"><span>' + (p.category === '?' ? '❓ без категории' : esc(c.icon + ' ' + p.category)) + '</span><b>' + money(p.amount) + '</b></div>';
  }).join('') + (Math.abs(diff) >= 0.01 ? '<div class="muted small" style="margin-top:6px">В банке ' + money(F.bank) + ' — разница ' + money(diff) + ' будет учтена в самой крупной категории.</div>' : '');
}
function renderSplit() {

  openSheet(sheetHead('Разнести чек') + rcSummary(rc) +
    '<div class="muted small" style="margin-bottom:10px">Операция: ' + esc(F.targetTitle) + ' · ' + money(F.bank) + '</div>' +
    (canRetry ? '<div class="actions" style="margin-bottom:12px"><button class="btn ghost" data-act="rc-retry">↻ Запросить состав чека ещё раз</button></div>' : '') +
    '<h4 class="rch">' + (items.length ? 'Категория для всех товаров' : 'Категория') + '</h4>' +
    '<div class="cgrid">' + catsOf('expense').map(function (c) {
      return '<button class="cchip' + (F.main === c.name ? ' on' : '') + '" style="--c:' + c.color + '" data-act="rc-main" data-name="' + esc(c.name) + '"><span>' + esc(c.icon) + '</span>' + esc(c.name) + '</button>';
    }).join('') + '</div>' +
    (items.length ? '<h4 class="rch">Товары <small class="muted">— можно задать категорию отдельно</small></h4><div class="rcitems">' + items.map(function (x, i) {
      return '<div class="rcitem"><div class="mid"><div class="t1">' + esc(x.name) + '</div><div class="t2">' + (x.qty !== 1 ? x.qty + ' × ' + money(x.price) + ' = ' : '') + money(x.sum) + '</div></div>' +
        '<select class="rcsel" data-i="' + i + '">' + expCatOptions(F.itemCats[i], 'как у всех') + '</select></div>';
    }).join('') + '</div>' +
    '<label class="check" style="margin-top:12px"><input type="checkbox" id="rc-rem"' + (F.remember ? ' checked' : '') + '>Запомнить категории товаров, выбранные отдельно</label>' : '') +
    '<div class="section" id="rc-totals" style="padding:10px 12px">' + totalsHtml() + '</div>' +
    '<div class="actions"><button class="btn ghost" data-act="close">Отмена</button><button class="btn primary" data-act="rc-save">Сохранить</button></div>');

function itemPattern(name) {

}
function saveSplit() {

  if (!parts.length) return toast('Выберите категорию', true);
  var rem = $('#rc-rem'); if (rem) F.remember = rem.checked;

    itemCats: (F.receipt.items || []).map(function (x, i) { return F.itemCats[i] || F.main; }) })
    .then(function (res) {
      closeSheet();

// ---------- просмотр чека ----------
function showReceipt(rc) {

    (rc.items && rc.items.length ? '<div class="rcitems">' + rc.items.map(function (x) {

    }).join('') + '</div>' : '<div class="empty">Состав чека не получен</div>') +
    (ops.length ? '<h4 class="rch">Учтено как</h4><div class="section" style="padding:10px 12px">' + ops.map(function (o) {
      var c = catInfo('expense', o.category);

}
function openReceiptById(id) {

    F = { kind: 'rcpt', target: null, receipt: rc, candidates: (p && p.candidates) || [] };
    if (F.candidates.length) renderMatch(); else renderNoPair();
  }).catch(function (e) { toast(e, true); });
}

// ---------- «Поделиться» картинкой ----------
function handleShare() {
  if (!/[?&]share=1/.test(location.search) || handleShare.done) return;
  handleShare.done = true;
  history.replaceState(null, '', location.pathname);
  if (!('caches' in window)) return;
  caches.open('budget-share').then(function (c) {
    return c.match('./shared-file').then(function (r) {
      if (r) return r.blob().then(function (b) { c.delete('./shared-file'); return decodeQrFile(b); });

        if (!t) throw 'Не получилось открыть то, чем поделились';

      });
    });
  }).then(function (txt) { F = { kind: 'rcpt', target: null }; openSheet(sheetHead('Чек по QR') + '<div class="loader" style="height:120px"><div class="spin"></div></div>'); return submitQr(txt); })
    .catch(function (e) { toast(e, true); });
}

// ---------- действия ----------
Object.assign(ACTIONS, {
  'rc-scan': function () { openScan(null); },
  'rc-raw': function () { submitQr(val('qr-raw')); },
  'rc-pick': function (el) { var c = F.candidates[+el.dataset.i]; goSplit({ kind: c.kind, id: c.id }); },

  'rc-manual': function () { renderManual(); },
  'rc-back': function () { if (F.candidates && F.candidates.length) renderMatch(); else renderNoPair(); },

  'rc-del': function (el) {

    api('deleteReceipt', { id: F.receipt.id }).then(function () { closeSheet(); toast('Чек удалён'); return reload(); })
      .catch(function (e) { busy(false); toast(e, true); });
  },
  'rc-retry': function () {
    busy(true);

      toast(res.receipt.items && res.receipt.items.length ? 'Состав получен' : (res.receipt.error || 'Пока нет данных'), !(res.receipt.items && res.receipt.items.length));
    }).catch(function (e) { busy(false); toast(e, true); });
  },
  'rc-main': function (el) {

document.addEventListener('change', function (e) {

<script>
// ======================= Покупки (товары из чеков) =======================
S.buy = { mode: 'month', year: Number(S.ym.slice(0, 4)) };
S.buyCache = {};

function buyRange() {
  if (S.buy.mode === 'year') return { key: 'y' + S.buy.year, from: S.buy.year + '-01', to: S.buy.year + '-12', title: S.buy.year + ' год' };
  return { key: 'm' + S.ym, from: S.ym, to: S.ym, title: ymTitle(S.ym) };
}
function fmtQty(v, unit) {
  var n = unit === 'шт' ? Math.round(v * 10) / 10 : Math.round(v * 100) / 100;
  return String(n).replace('.', ',') + ' ' + unit;
}
function aggGroups(rows) {
  var by = {};
  rows.forEach(function (r) {
    var g = r[4] || '', a = by[g] || (by[g] = { name: g, sum: 0, cnt: 0, units: {}, rows: [] });
    a.sum += r[7]; a.cnt++; a.rows.push(r);
    a.units[r[9]] = a.units[r[9]] || { amount: 0, sum: 0 };
    a.units[r[9]].amount += r[8]; a.units[r[9]].sum += r[7];
  });
  return Object.keys(by).map(function (k) { return by[k]; }).sort(function (a, b) { return b.sum - a.sum; });
}
// главная единица группы: та, на которую пришлась большая часть денег
function mainUnit(a) {
  var best = null;
  Object.keys(a.units).forEach(function (u) { if (!best || a.units[u].sum > a.units[best].sum) best = u; });
  return best ? { unit: best, amount: a.units[best].amount, price: a.units[best].amount ? a.units[best].sum / a.units[best].amount : 0 } : null;
}
function loadBuy(force) {
  var rg = buyRange();
  if (!force && S.buyCache[rg.key]) return Promise.resolve(S.buyCache[rg.key]);
  return api('getPurchases', { from: rg.from, to: rg.to }).then(function (d) {
    S.buyCache[rg.key] = d;
    if (d.groups) S.data.productGroups = d.groups;
    return d;
  });
}
function buySwitcher() {
  if (S.buy.mode === 'year') {
    return '<div class="month"><button data-act="buy-year" data-k="-1">‹</button><span>' + S.buy.year + '</span><button data-act="buy-year" data-k="1">›</button></div>';
  }
  return monthSwitcher();
}
function viewBuy() {
  var rg = buyRange(), d = S.buyCache[rg.key];
  var html = '<div class="topbar"><div class="title">Покупки</div>' + buySwitcher() + '</div>' +
    '<div class="addrow"><button class="btn ghost" data-act="rc-scan">📷 Добавить чек по QR</button></div>' +
    '<div class="chips"><button class="chip' + (S.buy.mode === 'month' ? ' on' : '') + '" data-act="buy-mode" data-m="month">Месяц</button>' +
    '<button class="chip' + (S.buy.mode === 'year' ? ' on' : '') + '" data-act="buy-mode" data-m="year">Год</button></div>';
  if (!d) {
    loadBuy().then(function () { if (S.view === 'buy') render(); }).catch(function (e) { toast(e, true); });
    return html + '<div class="loader" style="height:30vh"><div class="spin"></div>Загружаю покупки…</div>';
  }
  if (!d.rows.length) {
    return html + '<div class="section"><div class="empty">За ' + (S.buy.mode === 'year' ? S.buy.year + ' год' : 'этот месяц') +
      ' покупок из чеков нет.<br>Добавьте чек по QR — товары появятся здесь.</div></div>';
  }
  var groups = aggGroups(d.rows), total = d.rows.reduce(function (s, r) { return s + r[7]; }, 0);
  var none = groups.find(function (g) { return !g.name; });
  html += '<div class="summary"><span><b>' + d.rows.length + '</b> товаров</span><span>на <b>' + money(total) + '</b></span><span><b>' + groups.filter(function (g) { return g.name; }).length + '</b> групп</span></div>';
  if (none) {
    html += '<div class="section inbox"><h3>❓ Без группы <small>' + none.rows.length + ' — нажмите, чтобы определить</small></h3>' +
      none.rows.slice().sort(function (a, b) { return b[7] - a[7]; }).map(buyItemHtml).join('') + '</div>';
  }
  html += '<div class="section">' + groups.filter(function (g) { return g.name; }).map(function (g) {
    var mu = mainUnit(g), sub = g.cnt + ' ' + plural(g.cnt, 'покупка', 'покупки', 'покупок');
    if (mu && mu.amount) sub += ' · ' + fmtQty(mu.amount, mu.unit) + (mu.unit !== 'шт' || mu.amount !== g.cnt ? ' · ' + money(mu.price) + '/' + mu.unit : '');
    var share = Math.round(g.sum / total * 100);
    return '<button class="item" data-act="buy-group" data-g="' + esc(g.name) + '"><div class="ico" style="--c:#3fb950">🧺</div>' +
      '<div class="mid"><div class="t1">' + esc(g.name) + '</div><div class="t2">' + sub + '</div>' +
      '<div class="bar"><i style="width:' + Math.max(2, share) + '%"></i></div></div>' +
      '<div class="amt">' + money(g.sum) + '</div></button>';
  }).join('') + '</div>';
  return html;
}
function plural(n, a, b, c) {

    }).join('') + '</div><div class="small" style="margin-top:6px">С первого месяца цена ' +

function openGroupForm(g) {

<script>
// ======================= Счета =======================
TYPES.transfer = { one: 'Перевод', many: 'Переводы', sign: '', cls: '' };
TYPES.adjust = { one: 'Корректировка', many: 'Корректировки', sign: '', cls: '' };
var OP_TYPES = ['expense', 'income', 'saving', 'transfer'];
var ACC_TYPES = { card: 'Карта', cash: 'Наличные', savings: 'Накопительный', broker: 'Брокерский' };
var ACC_GROUPS = [
  { key: 'free', title: 'Свободные', types: ['card', 'cash'] },
  { key: 'savings', title: 'Накопления', types: ['savings'] },
  { key: 'broker', title: 'Инвестиции', types: ['broker'] }
];

function accList(withArchived) {
  return (S.data.accounts || []).filter(function (a) { return withArchived || !a.archived; })
    .sort(function (a, b) { return (a.archived - b.archived) || (a.order - b.order); });
}
function accById(id) { return (S.data.accounts || []).find(function (a) { return a.id === id; }); }
function mainAcc() { var l = accList(); return l.find(function (a) { return a.main; }) || l[0] || null; }
function accOf(o) { if (o.account) return o.account; var m = mainAcc(); return m ? m.id : ''; }
function accName(id) { var a = accById(id); return a ? a.name : '—'; }
function isStash(id) { var a = accById(id); return !!a && (a.type === 'savings' || a.type === 'broker'); }
// снятие с накопительного/брокерского обратно на карту уменьшает «сбережения месяца»
function savingSign(o) { return isStash(accOf(o)) && !isStash(o.toAccount) ? -1 : 1; }
function total(ops, type) {
  return ops.reduce(function (s, o) { return s + (o.type === type ? (type === 'saving' ? savingSign(o) : 1) * o.amount : 0); }, 0);
}
/** Балансы: для счетов со сверкой по SMS — баланс из банка, иначе — сумма операций. */
function balances() {
  var calc = {};
  accList(true).forEach(function (a) { calc[a.id] = 0; });
  var add = function (id, v) { if (id in calc) calc[id] = Math.round((calc[id] + v) * 100) / 100; };
  S.data.ops.forEach(function (o) {
    var acc = accOf(o);
    if (o.type === 'expense') add(acc, -o.amount);
    else if (o.type === 'income') add(acc, o.amount);
    else if (o.type === 'adjust') add(acc, o.amount);
    else if (o.type === 'saving' || o.type === 'transfer') { add(acc, -o.amount); if (o.toAccount) add(o.toAccount, o.amount); }
  });
  var out = {};
  accList(true).forEach(function (a) {
    out[a.id] = { calc: calc[a.id], shown: a.sync && a.bankBalance != null ? a.bankBalance : calc[a.id], bank: a.sync && a.bankBalance != null };
  });
  return out;
}
function accOptions(cur, filter, emptyLabel) {
  return (emptyLabel ? '<option value="">' + emptyLabel + '</option>' : '') + accList().filter(filter || function () { return true; }).map(function (a) {
    return '<option value="' + a.id + '"' + (a.id === cur ? ' selected' : '') + '>' + esc(a.icon + ' ' + a.name) + '</option>';
  }).join('');
}
function opSegHtml() {
  return '<div class="seg seg4">' + OP_TYPES.map(function (t) {
    return '<button class="' + (F.type === t ? 'on ' + t : '') + '" data-act="op-type" data-t="' + t + '">' + TYPES[t].one + '</button>';
  }).join('') + '</div>';
}
function fillAccDefaults(reset) {
  var main = mainAcc(), sms = F.smsAcc || '';
  var stash = accList().find(function (a) { return a.type === 'savings'; }) || accList().find(function (a) { return a.type === 'broker'; });
  if (reset) { F.account = ''; F.toAccount = ''; }
  if (F.type === 'transfer' || F.type === 'saving') {
    if (F.inboxType === 'income') { F.toAccount = F.toAccount || sms; }
    else { F.account = F.account || sms || (main && main.id) || ''; }
    if (F.type === 'saving' && !F.toAccount && F.inboxType !== 'income' && stash) F.toAccount = stash.id;

    F.account = F.account || sms || (main && main.id) || '';

}
function accountFields() {
  if (!(S.data.accounts || []).length) return '';

    return '<div class="row2"><label>Со счёта<select id="f-acc">' + accOptions(F.account, null, '— выберите —') + '</select></label>' +
      '<label>На счёт<select id="f-acc2">' + accOptions(F.toAccount, null, F.type === 'saving' ? '— не указан —' : '— выберите —') + '</select></label></div>' +
